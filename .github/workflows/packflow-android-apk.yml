name: CapnoEasy Android diagnostics APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capnoeasy-android-diagnostics-release
  cancel-in-progress: false

env:
  RELEASE_TAG: packflow-android-diagnostics-latest

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/libs.versions.toml
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build diagnostic APK
        working-directory: apps/android
        run: bash ./gradlew --no-daemon :app:assembleDebug -PcapnoSlsWebTracking=true
      - name: Verify APK signature and prepare artifact
        run: |
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          version="v$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          stem="CapnoEasy-android-diagnostics-${version}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          mkdir -p release_artifacts
          cp "$apk" "release_artifacts/$stem.apk"
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{version: $version, commit: $commit, run: $run, run_attempt: $attempt}' \
            > "release_artifacts/$stem.metadata.json"
      - name: Publish APK and build identity to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "CapnoEasy Android diagnostics" --notes "Diagnostic APKs archived by Packflow." \
              --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release_artifacts/*
